const items=[...(state.tasks.filter(t=>t.date===today()).map((t,i)=>({type:'task',id:t.id,title:t.title,time:t.id===state.focusId?'いま':i===1?'次':i===2?'あと':'予定',sub:`目安${t.minutes}分 · ${t.completed?'完了':'未完了'}`,done:t.completed}))),...state.events.filter(e=>e.date===today()).map(e=>({type:'event',id:e.id,title:e.title,time:e.start,sub:`${e.end}まで · ${e.fixed?'固定予定':'予定'}`,fixed:e.fixed}))];

function renderNight(){const ct=taskCounter();const minutes=state.worklogs.reduce((sum,w)=>sum+Math.round(w.seconds/60),0);const entry=state.diaries.find(d=>d.date===today());return `<div class="night-summary"><div class="moon">${ico('moon','lg')}</div><h2>今日も、おつかれさま。</h2><p>${ct.done===ct.total?'今日のタスクをひと区切りできました。':'今日の作業をここで区切り、記録を残せます。'}</p><div class="night-stats"><div><b>${ct.done} / ${ct.total}</b><span>完了したタスク</span></div><div><b>${minutes?minutes+'分':'—'}</b><span>記録した実働時間</span></div></div></div><div class="section-heading" style="margin-top:20px"><h2>今日のことを、少し残す。</h2></div><div class="diary-entry"><textarea id="diaryText" placeholder="今日あったこと、考えたこと、感じたこと…" aria-label="今日の日記">${escapeHtml(entry?.text||'')}</textarea><div class="diary-entry-actions"><button class="plain-action" data-action="leaveNight">あとで書く</button><button class="primary" data-action="saveDiary">${ico('up','sm')} ${entry?'更新する':'日記を残す'}</button></div></div><button class="mini-cta" data-action="diaryHistory">${ico('book','sm')} 過去の日記を見る ${ico('chevron','sm')}</button><button class="mini-cta" data-action="leaveNight">${ico('arrowRight','sm')} 今日のタスクに戻る</button>`}

function renderTodos(){let tasks=[...state.tasks];const q=(state.listSearch||'').trim();if(q)tasks=tasks.filter(t=>t.title.includes(q)||t.description.includes(q)||goalTitle(t.goal).includes(q));const order={高:0,中:1,低:2};switch(state.listSort){case'priority':tasks.sort((a,b)=>order[a.priority]-order[b.priority]);break;case'deadline':tasks.sort((a,b)=>(a.deadline||'9999').localeCompare(b.deadline||'9999'));break;case'created':tasks.sort((a,b)=>b.created-a.created);break;case'name':tasks.sort((a,b)=>a.title.localeCompare(b.title,'ja'));break;default:tasks.sort((a,b)=>a.created-b.created)};

if(name==='task'){const t=state.tasks.find(t=>t.id===transient.taskId);if(!t){transient.sheet=null;return renderSheet()}title='タスク詳細';body=`<div class="eyebrow">${t.completed?'完了済み':'実行すること'}</div><h2 style="font-size:22px;letter-spacing:-.6px;margin:6px 0">${escapeHtml(t.title)}</h2><p class="section-caption">${escapeHtml(t.description||'説明は未設定です。')}</p><div class="info-pair"><span>完了条件</span><span>作業がひと区切りついたら記録</span></div><div class="info-pair"><span>実行予定</span><span>${t.date?jd(t.date):'未定'}</span></div><div class="info-pair"><span>期限</span><span>${t.deadline?jd(t.deadline):'未設定'}</span></div><div class="info-pair"><span>見積もり</span><span>${t.minutes}分</span></div><div class="info-pair"><span>優先度</span><span>${escapeHtml(t.priority)}</span></div><div class="info-pair"><span>関連目標</span><span>${escapeHtml(goalTitle(t.goal))}</span></div><div class="section-heading"><h2>タスクを編集</h2></div><div class="field"><label>タスク名</label><input id="editTaskTitle" value="${escapeHtml(t.title)}" maxlength="150"></div><div class="field"><label>説明・次の一歩</label><textarea id="editTaskDesc">${escapeHtml(t.description)}</textarea></div><div class="field"><label>優先度</label><select id="editTaskPriority">${['高','中','低'].map(p=>`<option value="${p}" ${t.priority===p?'selected':''}>${p}</option>`).join('')}</select></div><div class="field"><label>実行予定日</label><input type="date" id="editTaskDate" value="${t.date||''}"></div><div class="field"><label>期限</label><input type="date" id="editTaskDeadline" value="${t.deadline||''}"></div>`;footer=`<button class="secondary" data-action="askTaskAI" data-id="${t.id}">${ico('sparkles','sm')} AIに相談</button><button class="primary" data-action="saveTask" data-id="${t.id}">編集を保存</button>`}
if(name==='event'){const e=state.events.find(e=>e.id===transient.taskId);title='予定の詳細';body=e?`<div class="eyebrow">${e.fixed?'固定予定':'作業枠'}</div><h2 style="font-size:21px;margin:6px 0 15px">${escapeHtml(e.title)}</h2><div class="info-pair"><span>日付</span><span>${jd(e.date)}</span></div><div class="info-pair"><span>時間</span><span>${e.start}〜${e.end}</span></div><div class="review-box"><p>固定予定は、AIによる再計画で無断移動しない設計です。</p></div>`:''}
if(name==='stock'){const s=state.stocks.find(x=>x.id===transient.stockId);title='保存した項目';body=s?`<div class="eyebrow">${escapeHtml(({wish:'やりたいこと',places:'行きたい場所',ideas:'アイデア',reference:'資料',unclassified:'未整理',held:'保留'})[s.category]||'項目')}</div><h2 style="font-size:21px;line-height:1.5;margin:5px 0 10px">${escapeHtml(s.title)}</h2><p class="section-caption">${escapeHtml(s.detail)}</p><div class="field"><label>分類</label><select id="stockKind">${[['wish','やりたいこと'],['places','行きたい場所'],['ideas','アイデア'],['reference','資料'],['unclassified','未整理'],['held','保留']].map(([k,n])=>`<option value="${k}" ${s.category===k?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label>内容</label><textarea id="stockDetailText">${escapeHtml(s.detail)}</textarea></div><div class="review-box"><h3>元の文章を残す</h3><p>このデモは項目の分類を変更できます。実製品では元原文と派生項目を別に保持する想定です。</p></div>`:'';footer=`<button class="secondary" data-action="makeTaskFromStock">${ico('plus','sm')} ToDoに追加</button><button class="primary" data-action="saveStock">保存</button>`}
if(name==='goal'){const g=goals.find(x=>x.id===transient.goalId);title='ゴールの詳細';body=g?`<div class="eyebrow">目標・工程</div><h2 style="font-size:22px;margin:6px 0 10px">${escapeHtml(g.title)}</h2><p class="section-caption">${escapeHtml(g.note)}</p><div class="info-pair"><span>親の目標</span><span>${g.parent?escapeHtml(goalTitle(g.parent)):'最上位の目標'}</span></div><div class="info-pair"><span>子の工程</span><span>${goals.filter(x=>x.parent===g.id).length}件</span></div><div class="info-pair"><span>関連ToDo</span><span>${state.tasks.filter(x=>x.goal===g.id).length}件</span></div><div class="section-heading"><h2>関連するタスク</h2></div>${state.tasks.filter(x=>x.goal===g.id).map(t=>`<button class="list-row" data-action="taskDetail" data-id="${t.id}"><span class="list-txt"><strong>${escapeHtml(t.title)}</strong><small>目安${t.minutes}分</small></span>${ico('chevron','sm')}</button>`).join('')||'<p class="section-caption">この工程に直接紐づくタスクはありません。</p>'}`:'';footer=`<button class="primary" data-action="goalAI" data-id="${transient.goalId}">${ico('sparkles','sm')} AIと具体化する</button>`}
if(name==='compose'){title='思いつきを残す';body=`<p class="section-caption">分類や日付を決めなくても、そのまま保存できます。</p><div class="compose-field"><textarea id="captureText" maxlength="8000" placeholder="いま思いついたことを、そのまま…">${escapeHtml(transient.lastCaptured||'')}</textarea><button class="compose-submit" data-action="saveCapture" aria-label="保存">${ico('up')}</button></div><p class="sheet-hint">↑ を押すとまず原文を保存します。AIによる整理は後から選べます。</p><div class="review-box"><h3>原文が起点になる</h3><p>一つの思いつきからToDoや希望が生まれても、最初の文章を残す設計です。</p></div>`}
if(name==='captured'){title='保存しました';body=`<div class="review-box"><h3>${ico('check','sm')} 原文を保存</h3><p>${escapeHtml(transient.lastCaptured||'')}</p></div><p class="sheet-hint">整理する場合は、保存済みの文章に分類を付けられます（このデモはルールベースの簡易操作です）。</p><div class="seg-row">${[['unclassified','未整理のまま'],['todo','ToDo'],['wish','やりたいこと'],['places','行きたい場所'],['ideas','アイデア'],['reference','資料']].map(([k,n])=>`<button class="${transient.captureCategory===k?'selected':''}" data-action="captureCategory" data-id="${k}">${n}</button>`).join('')}</div>`;footer=`<button class="secondary" data-action="closeSheet">あとで整理</button><button class="primary" data-action="applyCaptureCategory">分類を確定</button>`}
if(name==='newTask'){title='ToDoを追加';body=`<div class="field"><label>タスク名</label><input id="newTaskTitle" placeholder="やることを入力"></div><div class="field"><label>説明・次の一歩</label><textarea id="newTaskDescription" placeholder="最初にすること"></textarea></div><div class="field"><label>実行予定日</label><input type="date" id="newTaskDate" value="${today()}"></div><div class="field"><label>目安（分）</label><input type="number" id="newTaskMinutes" min="1" max="1000" value="25"></div>`;footer=`<button class="primary" data-action="saveNewTask">${ico('plus','sm')} タスクを保存</button>`}
if(name==='endSession'){title='作業を終了';const f=focusTask();body=`<p class="section-caption">${escapeHtml(f?.title||'作業')}の実行時間を記録します。今回の作業終了とタスク完了は別に扱います。</p><div class="review-box"><h3>実働時間</h3><p style="font-size:25px;color:var(--ink);font-weight:760">${secondsDisplay(elapsed())}</p></div><div class="field"><label>今回できたこと（任意）</label><textarea id="outcomeText" placeholder="読めた部分や分かったこと"></textarea></div>`;footer=`<button class="secondary" data-action="finishSession" data-finish="continue">残作業あり</button><button class="primary" data-action="finishSession" data-finish="complete">タスクも完了</button>`}
if(name==='diaries'){title='日記・記録';body=state.diaries.length?state.diaries.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(d=>`<div class="review-box"><div class="eyebrow">${jd(d.date)}</div><p style="color:var(--ink);white-space:pre-wrap">${escapeHtml(d.text)}</p></div>`).join(''):'<div class="blank">保存した日記はまだありません。<br>夜のホームから記録できます。</div>'}
if(name==='proposal'){title='予定変更案の比較';body=`<div class="review-box"><div class="eyebrow">元の予定を維持</div><h3>変更なし</h3><p>確定している固定予定には手を加えません。</p></div><div class="review-box"><div class="eyebrow">案A · デモ</div><h3>作業を後ろへ移す</h3><p>「卒論の分析方針を整理する」を今日から明日へ移します。固定予定「散歩」は維持します。</p></div><div class="review-box"><div class="eyebrow">案B · デモ</div><h3>作業範囲を短くする</h3><p>今日中に着手する範囲を減らし、残作業を未確定のまま保持します。</p></div><div class="review-box"><h3>${ico('alert','sm')} 重要な確認</h3><p>これは固定されたサンプル案です。実際のF6の制約検証・版競合・AI推論は動作していません。</p></div>`;footer=`<button class="secondary" data-action="closeSheet">変更しない</button><button class="primary" data-action="applyMockProposal">案Aをデモ適用</button>`}
if(name==='reset'){title='デモデータを初期化';body=`<div class="review-box"><h3>ブラウザ内の試用データを削除します</h3><p>追加したタスク、自由入力、日記、相談のデモ履歴を初期サンプルに戻します。実際のLife OSのデータは変更されません。</p></div>`;footer=`<button class="secondary" data-action="closeSheet">キャンセル</button><button class="primary" data-action="confirmReset">初期化する</button>`}
const close=`<button class="round-btn" data-action="closeSheet" aria-label="閉じる">${ico('close')}</button>`;
el('overlay').innerHTML=`<div class="sheet-backdrop" id="sheetBackdrop"><div class="sheet" role="dialog" aria-modal="true" aria-label="${escapeHtml(title)}"><div class="grabber"></div><div class="sheet-head"><h2>${title}</h2>${close}</div><div class="sheet-body">${body}</div>${footer?`<div class="sheet-actions">${footer}</div>`:''}</div></div>`}
function openSheet(name){transient.menu=null;transient.sheet=name;render();}
function closeSheet(){transient.sheet=null;render()}
function switchTab(name){if(name==='compose'){openSheet('compose');return}state.tab=name;state.homeMode=name==='home'?'today':state.homeMode;transient.menu=null;transient.sheet=null;render();el('main').scrollTop=0;if(name==='ai')scrollAI()}
function openCalendar(mode){state.tab='home';state.homeMode=mode;state.viewDate=state.viewDate||today();transient.menu=null;transient.sheet=null;render();el('main').scrollTop=0}
function switchMenu(menu){transient.menu=transient.menu===menu?null:menu;renderMenu()}
function renderCalendar(){const d=state.viewDate;const m=state.homeMode;let out=top(`${iconBtn('back','todayView','今日に戻る')}${iconBtn('calendar','calendarMenu','日・週・月を切り替える')}`);out+=`<div class="date-label">${m==='day'?'一日の流れ':m==='week'?'一週間の見通し':'今月の見通し'}</div><h1 class="page-title">カレンダー</h1><div class="tabs-segment">${[['day','日'],['week','週'],['month','月']].map(([k,t])=>`<button class="${m===k?'sel':''}" data-action="calendar" data-mode="${k}">${t}</button>`).join('')}</div>`;
const hdr=`<div class="week-head"><span class="calendar-title">${m==='day'?jd(d,{month:'long',day:'numeric',weekday:'short'}):monthStr(d)}</span><div class="calendar-navs">${smallBtn('back','calPrev','前へ')}${smallBtn('chevron','calNext','次へ')}</div></div>`;
out+=hdr;if(m==='day'){const ev=state.events.filter(x=>x.date===d).sort((a,b)=>a.start.localeCompare(b.start));let ts=state.tasks.filter(x=>x.date===d);out+=`<p class="section-caption">${d===today()?'今日の':'選択した日の'}予定と作業枠を表示しています。</p>${ev.map(e=>`<div class="cal-day-block"><div class="cal-time">${e.start}</div><button class="cal-block ${e.fixed?'fixed':''}" data-action="eventDetail" data-id="${e.id}"><strong>${escapeHtml(e.title)}</strong><small>${e.start}〜${e.end} · ${e.fixed?'固定予定':'作業枠'}</small></button></div>`).join('')||'<div class="blank">時間が決まった予定はありません。</div>'}<div class="section-heading"><h2>時間が決まっていないToDo</h2><span class="chip gray">${ts.length}件</span></div><div class="compact-list">${ts.map(taskRow).join('')||'<div class="blank">この日のToDoはありません。</div>'}</div>`;const diaries=state.diaries.filter(x=>x.date===d);if(diaries.length)out+=`<div class="section-heading"><h2>この日の記録</h2></div>${diaries.map(x=>`<div class="review-box"><p>${escapeHtml(x.text)}</p></div>`).join('')}`}
else if(m==='week'){const day=dateObj(d).getDay(),start=addDays(d,-((day+6)%7));const ds=Array.from({length:7},(_,i)=>addDays(start,i));out+=`<div class="week-strip">${ds.map(x=>`<button class="week-day ${x===d?'sel':''}" data-action="selectDate" data-date="${x}"><small>${dow(x)}</small><b>${dateObj(x).getDate()}</b><small>${state.events.filter(e=>e.date===x).length+state.tasks.filter(t=>t.date===x).length}件</small></button>`).join('')}</div><div class="section-heading"><h2>この週の予定</h2></div>${ds.map(x=>{const ts=state.tasks.filter(t=>t.date===x),es=state.events.filter(e=>e.date===x);return `<button class="day-pill" data-action="selectDate" data-date="${x}"><span><strong>${jd(x,{month:'numeric',day:'numeric',weekday:'short'})}</strong><br><small>${es.length?es.map(e=>e.title).join('・'):ts.length?ts[0].title:'空いている時間あり'}</small></span><span class="chip gray">${ts.length+es.length}件</span></button>`}).join('')}`}
else{const x=dateObj(d);const start=new Date(x.getFullYear(),x.getMonth(),1);const startOffset=(start.getDay()+6)%7;const iso1=`${start.getFullYear()}-${String(start.getMonth()+1).padStart(2,'0')}-01`;const startISO=addDays(iso1,-startOffset);let days=Array.from({length:42},(_,i)=>addDays(startISO,i));out+=`<div class="weekdays">${['月','火','水','木','金','土','日'].map(v=>`<span>${v}</span>`).join('')}</div><div class="month-grid">${days.map(x=>{const outside=dateObj(x).getMonth()!==dateObj(d).getMonth();const num=state.tasks.filter(t=>t.date===x).length+state.events.filter(e=>e.date===x).length;return `<button class="month-cell ${outside?'outside':''} ${x===d?'selected':''} ${x===today()?'today':''}" data-action="selectDate" data-date="${x}"><span>${dateObj(x).getDate()}</span><span class="day-dots">${num?'<b></b>':''}${num>2?'<b></b>':''}</span></button>`}).join('')}</div><div class="cal-legend"><span><i class="legend-dot"></i> 予定・タスクのある日</span><span>日付をタップして詳細を見る</span></div><div class="section-heading"><h2>選択した日の予定</h2></div><button class="day-pill" data-action="calendar" data-mode="day"><span><strong>${jd(d)}</strong><br><small>${state.tasks.filter(t=>t.date===d).length+state.events.filter(e=>e.date===d).length}件の項目</small></span>${ico('chevron','sm')}</button>`}
return out+`<div class="caption-note">時間未定のタスクを自動で予定へ確定しません。</div>`}
function scrollAI(){requestAnimationFrame(()=>{const main=el('main');main.scrollTop=main.scrollHeight})}
function askAI(text){const q=String(text||'').trim();if(!q)return;state.tab='ai';state.aiMessages.push({role:'user',text:q});let a='';let prop=false;if(/予定|リスケ|変更|時間|遅れ|間に合/.test(q)){a='いまの予定を変更するなら、次の3案を比較する方法が考えられます。\n\n・案A：一部の作業を明日へ移す\n・案B：今日の作業範囲を小さくする\n・変更なし：固定予定を維持する\n\n実際の変更前には、固定予定・期限・残作業量の検証と承認が必要です。';prop=true}else if(/卒論|目標|分解|研究/.test(q)){a='目標を具体化するなら、まず「先行研究の整理」「データと手法の選定」「分析と執筆」に分けられます。\n\n今すぐの一歩としては「先行研究を1本開き、要旨から論点を1つ記録する」が候補です。これはデモ応答のため、目標ツリーへの自動追加は行いません。'}else if(/整理|分類|思いつき|希望/.test(q)){a='入力した内容は、ToDo・やりたいこと・行きたい場所・資料などの候補に分けられます。\n\nただし、「行きたい」を勝手に「行くべきタスク」には変更しません。分類候補を確認してから確定する設計です。'}else{a='相談内容を受け取りました。実際のLife OSでは、必要な範囲のタスク・目標・予定を参照して提案します。\n\nこのHTMLはデザイン確認用のため、ここでは定型的なデモ応答を表示しています。'}state.aiMessages.push({role:'assistant',text:a,proposal:prop});transient.aiInput='';render();scrollAI()}
function handle(action,ds){const id=ds.id;switch(action){case'tab':switchTab(id);break;case'compose':openSheet('compose');break;case'settings':openSheet('settings');break;case'calendarMenu':switchMenu('calendar');break;case'categories':switchMenu('categories');break;case'sortMenu':switchMenu('sort');break;case'goalViewMenu':switchMenu('goal');break;case'calendar':openCalendar(ds.mode||'day');break;case'todayView':state.homeMode='today';state.tab='home';transient.menu=null;render();break;case'selectCategory':state.listCategory=id;transient.menu=null;render();break;case'selectSort':state.listSort=id;transient.menu='sort';render();break;case'selectGroup':state.listGroup=id;transient.menu='sort';render();break;case'searchToggle':state.listSearching=!state.listSearching;render();if(state.listSearching)el('listQuery')?.focus();break;case'clearSearch':state.listSearch='';render();el('listQuery')?.focus();break;case'goalMode':state.goalMode=ds.mode;transient.menu=null;render();break;case'expandGoal':state.expanded.includes(id)?state.expanded=state.expanded.filter(x=>x!==id):state.expanded.push(id);render();break;case'goalDetail':transient.goalId=id;openSheet('goal');break;case'goalAI':state.lastAIContext=goalTitle(id);state.tab='ai';transient.sheet=null;render();scrollAI();break;case'taskDetail':transient.taskId=id;openSheet('task');break;case'stockDetail':transient.stockId=id;openSheet('stock');break;case'eventDetail':transient.taskId=id;openSheet('event');break;case'toggleTask':{const t=state.tasks.find(x=>x.id===id);if(t){t.completed=!t.completed;if(t.completed&&t.id===state.focusId&&state.session.status==='running'){t.completed=false;hint('実行中の作業は先に終了してください');return}if(t.completed&&t.id===state.focusId){state.session={status:'idle',startedAt:0,elapsed:0}}render();hint(t.completed?'タスクを完了にしました':'未完了に戻しました')}}break;case'start':{if(!focusTask())return;if(state.session.status==='running')return;state.session.status='running';state.session.startedAt=Date.now();render()}break;case'pause':state.session.elapsed=elapsed();state.session.status='paused';state.session.startedAt=0;render();break;case'endSession':openSheet('endSession');break;case'finishSession':{const sec=elapsed(),f=focusTask();if(f){state.worklogs.push({taskId:f.id,date:today(),seconds:sec,outcome:el('outcomeText')?.value||''});if(ds.finish==='complete')f.completed=true}state.session={status:'idle',startedAt:0,elapsed:0};transient.sheet=null;render();hint(ds.finish==='complete'?'実績と完了を記録しました':'実績を記録しました。残作業は保持します')}break;case'wrapDay':state.wrapped=true;render();break;case'leaveNight':state.nightPreview=false;state.wrapped=false;render();break;case'saveDiary':{const content=el('diaryText')?.value.trim();if(!content){hint('日記の文章を入力してください');return}let d=state.diaries.find(d=>d.date===today());if(d)d.text=content;else state.diaries.push({date:today(),text:content});render();hint('今日の日記を保存しました')}break;case'diaryHistory':openSheet('diaries');break;case'toggleNight':state.nightPreview=!state.nightPreview;state.wrapped=false;transient.sheet=null;state.tab='home';state.homeMode='today';render();break;case'toggleDark':state.dark=!state.dark;render();break;case'reset':openSheet('reset');break;case'confirmReset':state=init();transient.sheet=null;render();hint('初期状態に戻しました');break;case'closeSheet':closeSheet();break;case'quickTask':openSheet('newTask');break;case'saveNewTask':{const name=el('newTaskTitle')?.value.trim();if(!name){hint('タスク名を入力してください');return}state.tasks.push({id:'t'+Date.now(),title:name,description:el('newTaskDescription')?.value||'',minutes:Math.max(1,Number(el('newTaskMinutes')?.value)||25),priority:'中',date:el('newTaskDate')?.value||null,deadline:null,goal:null,completed:false,created:Date.now()});transient.sheet=null;render();hint('ToDoに追加しました')}break;case'saveTask':{const t=state.tasks.find(x=>x.id===id);if(!t)return;const name=el('editTaskTitle')?.value.trim();if(!name){hint('タスク名を入力してください');return}t.title=name;t.description=el('editTaskDesc')?.value||'';t.priority=el('editTaskPriority')?.value||'中';t.date=el('editTaskDate')?.value||null;t.deadline=el('editTaskDeadline')?.value||null;transient.sheet=null;render();hint('タスクを更新しました')}break;case'askTaskAI':{const t=state.tasks.find(t=>t.id===id);state.lastAIContext=t?.title||null;state.tab='ai';transient.sheet=null;render();scrollAI()}break;case'saveStock':{const s=state.stocks.find(x=>x.id===transient.stockId);if(s){s.category=el('stockKind')?.value||s.category;s.detail=el('stockDetailText')?.value||'';transient.sheet=null;render();hint('項目を更新しました')}}break;case'makeTaskFromStock':{const s=state.stocks.find(x=>x.id===transient.stockId);if(!s)return;state.tasks.push({id:'t'+Date.now(),title:s.title,description:s.detail,minutes:30,priority:'中',date:null,deadline:null,goal:null,completed:false,created:Date.now()});transient.sheet=null;state.tab='lists';state.listCategory='todo';render();hint('希望を残したままToDoを作成しました')}break;case'saveCapture':{const text=el('captureText')?.value.trim();if(!text){hint('文章を入力してください');return}state.stocks.push({id:'s'+Date.now(),category:'unclassified',title:text.length>60?text.slice(0,60)+'…':text,detail:text,created:Date.now()});transient.lastCaptured=text;transient.captureCategory='unclassified';transient.sheet='captured';render();hint('原文を保存しました')}break;case'captureCategory':transient.captureCategory=id;renderSheet();break;case'applyCaptureCategory':{const st=state.stocks.find(x=>x.detail===transient.lastCaptured&&x.category==='unclassified');const category=transient.captureCategory;if(category==='todo'){state.tasks.push({id:'t'+Date.now(),title:st?.title||transient.lastCaptured,description:transient.lastCaptured,minutes:25,priority:'中',date:null,deadline:null,goal:null,completed:false,created:Date.now()});/* Original remains in stock */}else if(st&&category!=='unclassified')st.category=category;transient.sheet=null;render();hint(category==='todo'?'原文を残してToDo候補を作成しました':'分類を保存しました')}break;case'newChat':state.aiMessages=[];state.lastAIContext=null;render();break;case'askSample':askAI(ds.text);break;case'sendAI':askAI(el('aiMessageText')?.value||transient.aiInput);break;case'proposal':openSheet('proposal');break;case'applyMockProposal':{const t=state.tasks.find(x=>x.id==='t2');if(t){t.date=addDays(today(),1);state.planShifted=true}transient.sheet=null;render();hint('デモで日程を変更しました（実際のF6ではありません）')}break;case'calPrev':moveCal(-1);break;case'calNext':moveCal(1);break;case'selectDate':state.viewDate=ds.date;state.homeMode='day';render();break;}}
function moveCal(dir){let d=state.viewDate;if(state.homeMode==='day')d=addDays(d,dir);else if(state.homeMode==='week')d=addDays(d,dir*7);else{const x=dateObj(d);const day=Math.min(x.getDate(),28);let y=new Date(x.getFullYear(),x.getMonth()+dir,day);d=`${y.getFullYear()}-${String(y.getMonth()+1).padStart(2,'0')}-${String(y.getDate()).padStart(2,'0')}`}state.viewDate=d;render()}
document.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(button){event.preventDefault();handle(button.dataset.action,button.dataset);return}if(event.target.id==='sheetBackdrop'){closeSheet();return}if(transient.menu&&!event.target.closest('.floating-menu')){transient.menu=null;renderMenu()}});
document.addEventListener('input',e=>{if(e.target.id==='listQuery'){state.listSearch=e.target.value;const pos=e.target.selectionStart;render();const input=el('listQuery');if(input){input.focus();input.setSelectionRange(pos,pos)}}if(e.target.id==='aiMessageText')transient.aiInput=e.target.value});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(transient.sheet)closeSheet();else{transient.menu=null;renderMenu()}}if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='aiMessageText'){e.preventDefault();askAI(e.target.value)}});
setInterval(()=>{if(state.session.status==='running'&&el('timer-val'))el('timer-val').textContent=secondsDisplay(elapsed())},1000);
window.App={previewNight(){state.nightPreview=!state.nightPreview;state.wrapped=false;state.tab='home';state.homeMode='today';transient.sheet=null;render()},openCalendar,switchTab,resetDemo(){openSheet('reset')}};
for(let i=1;i<=4;i++){const holder=el('feature-icon-'+i);if(holder)holder.innerHTML=ico(['layers','calendar','sparkles','file'][i-1])}
render();
})();
</script>
</body>
